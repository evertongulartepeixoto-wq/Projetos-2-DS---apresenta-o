<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Desafio da Tabuada</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f8ff; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        font-size: 32px; font-weight: bold; margin-bottom: 20px; }
        input { font-size: 24px; width: 80px; text-align: center; padding: 5px; }
        button { font-size: 24px; padding: 5px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #mensagem { font-size: 24px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Desafio da Tabuada 🧮</h2>
    <div id="conta">0 x 0</div>
    <input type="number" id="resposta" placeholder="?">
    <button onclick="verificar()">Enviar</button>
    <div id="mensagem"></div>
</div>

<script>
    let num1, num2, resultadoCorreto;

    function gerarConta() {
        num1 = Math.floor(Math.random() * 9) + 1; // Número de 1 a 9
        num2 = Math.floor(Math.random() * 9) + 1;
        resultadoCorreto = num1 * num2;
        document.getElementById('conta').innerText = `${num1} x ${num2}`;
        document.getElementById('resposta').value = '';
        document.getElementById('resposta').focus();
    }

    function verificar() {
        let respostaUsuario = parseInt(document.getElementById('resposta').value);
        let msg = document.getElementById('mensagem');

        if (respostaUsuario === resultadoCorreto) {
            msg.innerText = "✅ Correto! Parabéns!";
            msg.style.color = "green";
            setTimeout(gerarConta, 1500); // Gera nova conta após 1.5 segundos
        } else {
            msg.innerText = "❌ Tente novamente!";
            msg.style.color = "red";
        }
    }

    // Inicia o primeiro desafio ao carregar a página
    gerarConta();
</script>

</body>
</html>
